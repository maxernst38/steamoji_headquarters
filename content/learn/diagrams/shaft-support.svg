<svg viewBox="0 0 760 250" xmlns="http://www.w3.org/2000/svg">
  <!-- A shaft carried at one end is a lever, and the gear pays for it. -->
  <g transform="translate(70 40)">
    <rect x="0" y="20" width="26" height="60" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="2.5"/>
    <rect x="254" y="20" width="26" height="60" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="2.5"/>
    <line x1="10" y1="50" x2="270" y2="50" stroke="var(--good)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="140" cy="50" r="30" fill="none" stroke="var(--muted)" stroke-width="4"/>
    <circle cx="140" cy="50" r="7" fill="var(--muted)"/>
    <text class="label" x="13" y="104" text-anchor="middle">bearing</text>
    <text class="label" x="267" y="104" text-anchor="middle">bearing</text>
    <text class="title" x="140" y="138" text-anchor="middle">Supported at both ends</text>
    <text class="label" x="140" y="158" text-anchor="middle">The gear stays where it was set.</text>
  </g>

  <g transform="translate(420 40)">
    <rect x="0" y="20" width="26" height="60" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="2.5"/>
    <rect x="254" y="20" width="26" height="60" rx="4" fill="none" stroke="var(--line)" stroke-width="2.5" stroke-dasharray="5 5"/>
    <!-- unsupported end sags, and the gear tilts with it -->
    <path d="M10 50 Q150 52 270 78" fill="none" stroke="var(--bad)" stroke-width="6" stroke-linecap="round"/>
    <g transform="rotate(11 140 56)">
      <circle cx="140" cy="56" r="30" fill="none" stroke="var(--muted)" stroke-width="4"/>
      <circle cx="140" cy="56" r="7" fill="var(--muted)"/>
    </g>
    <text class="label" x="13" y="104" text-anchor="middle">bearing</text>
    <text class="label" x="267" y="104" text-anchor="middle">bare hole</text>
    <text class="title" x="140" y="138" text-anchor="middle">Held at one end</text>
    <text class="label" x="140" y="158" text-anchor="middle">The shaft flexes and the gear skips teeth.</text>
  </g>
</svg>
