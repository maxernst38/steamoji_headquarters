<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}VEX Tracker{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<header>
  <nav class="nav">
    <a class="brand" href="/">VEX Tracker</a>
    <a href="/" class="{{ 'on' if section == 'teams' }}">Teams</a>
    <a href="/matches" class="{{ 'on' if section == 'matches' }}">Matches</a>
    <a href="/events" class="{{ 'on' if section == 'events' }}">Events</a>
    <a href="/help" class="{{ 'on' if section == 'help' }}">How it's calculated</a>
  </nav>
  <h1>{% block heading %}{% endblock %}</h1>
  <p class="sub">{% block subheading %}{% endblock %}</p>
</header>
<main>
  {% block content %}{% endblock %}
</main>
<script>
// Filters apply as soon as they change. `fo` reopens the menu after the reload,
// so several filters can be set in a row; it is only sent on a filter change,
// not when the search button is pressed.
document.addEventListener('change', (event) => {
  const menu = event.target.closest('details.filters');
  if (!menu || !event.target.form) return;
  const flag = menu.querySelector('input[name="fo"]');
  if (flag) flag.disabled = false;
  event.target.form.submit();
});

// A button with data-toggle="<id>" shows and hides that panel. Used for the
// Add forms, which are POST forms and so cannot sit inside the filter form the
// way the Filters <details> does.
document.addEventListener('click', (event) => {
  const button = event.target.closest('[data-toggle]');
  if (!button) return;
  const panel = document.getElementById(button.dataset.toggle);
  if (!panel) return;
  panel.hidden = !panel.hidden;
  button.setAttribute('aria-expanded', String(!panel.hidden));
  if (!panel.hidden) panel.querySelector('input, select')?.focus();
});
</script>
{% block scripts %}{% endblock %}
